<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, intial-scale=1">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link href="../static/styles.css" rel="stylesheet">

        <!-- Fontawesome icons CDN-->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

        <!--Load Player List-->
        <script src="{{url_for('static', filename='scripts/loadPlayerlist.js') }}" defer></script>

        <!--Autocomplete Javascript-->
        <script src="{{url_for('static', filename='scripts/autocomplete.js') }}" defer></script>

        <!--Helpers Script-->
        <script src="{{url_for('static', filename='scripts/helpers.js') }}" defer></script>

        <!--Gamestate Script-->
        <script src="{{url_for('static', filename='scripts/gamestate.js') }}" defer></script>

        

        <title>Statline | Daily NBA Trivia Game</title>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap" rel="stylesheet">
    </head>
    <body>

        <!--Bootstrap Script-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid position-relative">

                <a class="navbar-brand position-absolute start-50 translate-middle-x" href="{{ url_for('index') }}">
                    <img src="../static/images/logo.webp" width="50" height="24">
                    StatLine
                </a>

                <div class="collapse navbar-collapse justify-content-end">

                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">

                        <li class="nav-item dropdown">

                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <img src="../static/images/dropdown.png" width="30" height="24">
                            </a>

                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="/"><i class="fa-solid fa-house"></i> Home</a></li>
                                <li><a class="dropdown-item" href="/userstats"><i class="fa-solid fa-chart-simple"></i> Stats</a></li>
                                <li><a class="dropdown-item" href="/archive"><i class="fa-solid fa-clock-rotate-left"></i> Archive</a></li>

                            </ul>
                        </li>

                        <li class="nav-item">
                            {% if user_logged_in %}
                                <a style="background-color:#0d2543; border-color: #0d2543;" class="btn btn-primary" href="/logout" role="button">Logout</a>
                            {% else %}
                                <a style="background-color:#0d2543; border-color: #0d2543;" class="btn btn-primary" href="/login" role="button">Login</a>
                            {% endif %}
                        </li>

                    </ul>

                </div>

            </div>
        </nav>

        <main>
            {% block main %}{% endblock %}
        </main>

        <footer id="pageFooter">
            <p class="brand">StatLine.net</p>

            <p style="font-style: italic;">
                A Daily NBA Trivia Game
                <br>
                nba.statline123@gmail.com - For Suggestions/Bugs
            </p>

            <!--Twitter Logo that links to twitter page-->
            <a href="https://www.x.com/nba_statline">
                <img src="../static/images/x_logo1.png" width="60" height="40">
            </a>
        </footer>
    </body>

</html>
